name: Develop Continues Delivery
on:
  push:
    branches: [develop]

  repository_dispatch:
    types: [Deploy Develop]

jobs:
  Build-develop-Code:
    name: Run Develop Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: executing develop build command
        uses: actions/setup-node@v2
        with:
          node-version: "17"
      - run: |
          npm install --legacy-peer-deps && npm run development
      - name: Success
        run: echo "📦 Build Status - ${{ job.status }}."

      - name: Deploy To Develop Server
        run: echo "🆗 Develop build status - ${{ job.status }}."
      - name: Transporting
        env:
          DESTINATION: "${{ secrets.SERVER_DEVELOP_USERNAME }}@${{ secrets.SERVER_DEVELOP_HOSTNAME }}:${{ secrets.SERVER_DEVELOP_PATH }}"
          DEPLOY_KEY: ${{ secrets.SERVER_DEVELOP_PRIVATE_KEY }}
        run: |
          echo "${{ env.DEPLOY_KEY }}" > deploy_key
          chmod 600 ./deploy_key
          rsync -chav --delete \
            -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
            ./build/* ${{ env.DESTINATION }}
      - name: Success
        run: echo "🚀 Deploy Status - ${{ job.status }}."
